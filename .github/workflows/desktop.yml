name: Build SnapFold Desktop

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapfold-desktop-linux
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri and reconstruction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             colmap             file             libayatana-appindicator3-dev             librsvg2-dev             libssl-dev             libwebkit2gtk-4.1-dev             libxdo-dev             patchelf

      - name: Verify native COLMAP engine
        run: |
          command -v colmap
          colmap -h | head -40
          colmap feature_extractor -h 2>&1 | grep -E "SiftExtraction.(use_gpu|num_threads|max_image_size|max_num_features)"
          colmap exhaustive_matcher -h 2>&1 | grep -E "SiftMatching.(use_gpu|num_threads|guided_matching)"

      - name: Smoke-test real COLMAP reconstruction
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/snapfold-colmap-smoke
          mkdir -p /tmp/snapfold-colmap-smoke/source /tmp/snapfold-colmap-smoke/images /tmp/snapfold-colmap-smoke/sparse

          wget -q             https://github.com/colmap/colmap/releases/download/3.11.1/south-building.zip             -O /tmp/snapfold-colmap-smoke/south-building.zip

          unzip -q /tmp/snapfold-colmap-smoke/south-building.zip             -d /tmp/snapfold-colmap-smoke/source

          find /tmp/snapfold-colmap-smoke/source -type f             \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \)             | sort             | head -32             | while read -r image; do cp "$image" /tmp/snapfold-colmap-smoke/images/; done

          test "$(find /tmp/snapfold-colmap-smoke/images -type f | wc -l)" -ge 12

          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
          colmap feature_extractor             --database_path /tmp/snapfold-colmap-smoke/database.db             --image_path /tmp/snapfold-colmap-smoke/images             --ImageReader.single_camera 1             --ImageReader.camera_model SIMPLE_RADIAL             --SiftExtraction.use_gpu 0             --SiftExtraction.num_threads 1             --SiftExtraction.max_image_size 1200             --SiftExtraction.max_num_features 4096

          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
          colmap exhaustive_matcher             --database_path /tmp/snapfold-colmap-smoke/database.db             --SiftMatching.use_gpu 0             --SiftMatching.num_threads 1             --SiftMatching.guided_matching 1

          colmap mapper             --database_path /tmp/snapfold-colmap-smoke/database.db             --image_path /tmp/snapfold-colmap-smoke/images             --output_path /tmp/snapfold-colmap-smoke/sparse

          MODEL_DIR="$(find /tmp/snapfold-colmap-smoke/sparse -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$MODEL_DIR"
          test -s "$MODEL_DIR/points3D.bin"

          colmap model_converter             --input_path "$MODEL_DIR"             --output_path /tmp/snapfold-colmap-smoke/model.ply             --output_type PLY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/snapfold-colmap-smoke/model.ply")
          data = path.read_bytes()[:32768].decode("ascii", errors="ignore")
          count = 0
          for line in data.splitlines():
              if line.startswith("element vertex "):
                  count = int(line.split()[-1])
                  break

          print(f"Smoke reconstruction PLY vertices: {count}")
          if count < 100:
              raise SystemExit(f"Smoke reconstruction is too small: {count} vertices")
          PY

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate desktop icons
        run: npx tauri icon public/favicon.svg

      - name: Verify frontend production build
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run build

      - name: Build Linux Debian package
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian dependencies and package
        shell: bash
        run: |
          DEB="$(find src-tauri/target/release/bundle/deb -type f -name "*.deb" -print -quit)"
          test -n "$DEB"
          dpkg-deb -I "$DEB" | tee /tmp/deb-info.txt
          grep -i "Depends:.*colmap" /tmp/deb-info.txt
          file "$DEB"
          sha256sum "$DEB" > SnapFold-desktop-SHA256SUMS.txt
          cat SnapFold-desktop-SHA256SUMS.txt

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapFold-v0.3.0-alpha.3-linux-deb
          compression-level: 0
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            SnapFold-desktop-SHA256SUMS.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="desktop-v0.3.0-alpha.3"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --prerelease               --title "SnapFold Desktop v0.3.0-alpha.3"               --notes "Linux Mint 22.x / Ubuntu 24.04 native reconstruction build. Alpha.3 keeps the low-memory COLMAP settings and removes sparse Delaunay meshing from the blocking reconstruction path. After SIFT, matching, incremental SfM, bundle adjustment, and PLY export, SnapFold immediately displays the real COLMAP point cloud instead of hanging at 91%."
          fi

          gh release upload "$TAG"             src-tauri/target/release/bundle/deb/*.deb             SnapFold-desktop-SHA256SUMS.txt             --clobber
