name: Build SnapFold Desktop

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapfold-desktop-linux
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri and reconstruction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             colmap             file             libayatana-appindicator3-dev             librsvg2-dev             libssl-dev             libwebkit2gtk-4.1-dev             libxdo-dev             patchelf

      - name: Verify native COLMAP engine
        run: |
          command -v colmap
          colmap -h | head -40
          colmap feature_extractor -h | grep -E "SiftExtraction.(use_gpu|max_image_size)"
          colmap exhaustive_matcher -h | grep -E "SiftMatching.(use_gpu|guided_matching)"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate desktop icons
        run: npx tauri icon public/favicon.svg

      - name: Verify frontend production build
        env:
          TAURI_ENV_PLATFORM: linux
        run: npm run build

      - name: Build Linux Debian package
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian dependencies and package
        shell: bash
        run: |
          DEB="$(find src-tauri/target/release/bundle/deb -type f -name "*.deb" -print -quit)"
          test -n "$DEB"
          dpkg-deb -I "$DEB" | tee /tmp/deb-info.txt
          grep -i "Depends:.*colmap" /tmp/deb-info.txt
          file "$DEB"
          sha256sum "$DEB" > SnapFold-desktop-SHA256SUMS.txt
          cat SnapFold-desktop-SHA256SUMS.txt

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapFold-v0.3.0-alpha.1-linux-deb
          compression-level: 0
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            SnapFold-desktop-SHA256SUMS.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="desktop-v0.3.0-alpha.1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --prerelease               --title "SnapFold Desktop v0.3.0-alpha.1"               --notes "Linux Mint 22.x / Ubuntu 24.04 native reconstruction build. Install the .deb with APT; its package metadata depends on Ubuntu's COLMAP package, so APT installs the native engine automatically. SnapFold then runs CPU SIFT extraction, exhaustive matching, incremental SfM and bundle adjustment, and displays the real COLMAP PLY reconstruction."
          fi

          gh release upload "$TAG"             src-tauri/target/release/bundle/deb/*.deb             SnapFold-desktop-SHA256SUMS.txt             --clobber
